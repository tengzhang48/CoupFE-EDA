  <title id="figure-title">3-D solder accumulated inelastic dissipation</title>
  <desc id="figure-description">Two 3 by 3 heatmaps show all 18 Hex8 element dissipation values from the checked CoupFE-EDA solder_3d_cycle runner. The center x-column has the peak values in both layers. The case is an idealized one-cycle study, not crack-location or package-life evidence.</desc>
