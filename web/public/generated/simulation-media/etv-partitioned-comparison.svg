    .muted { fill: #9eb0c8; } .label { fill: #cbd8ea; font-size: 13px; }
    .small { font-size: 12px; } .value { font: 600 13px ui-monospace, SFMono-Regular, monospace; }
    .axis { stroke: #52647e; stroke-width: 1; }
  </style>
