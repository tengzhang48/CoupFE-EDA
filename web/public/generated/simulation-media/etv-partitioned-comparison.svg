<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Partitioned ETV model comparison</title>
  <desc id="figure-description">Two grouped-bar panels compare quasisteady and backward-Euler lumped-temperature assumptions for the checked slow and fast CoupFE-EDA mechanics cases. The fast case shows a large energy difference and a lower lumped-transient peak temperature; the slow case nearly agrees.</desc>
