name: fast-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COUPFE_URL: https://github.com/tengzhang48/CoupFE.git
      COUPFE_BRANCH: main
      COUPFE_REF: e2f42ed5772850a0a23a2ce434f430c287eae5c8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install exact CoupFE source and CoupFE-EDA
        run: |
          python -m pip install --upgrade pip
          ./setup.sh
          python -m pip check
      - name: Run the component/reference harness
        run: python -m eda_multiphysics.run
      - name: Run default pytest tier (includes harness wrappers)
        run: python -m pytest -q
      - name: Build, smoke-install, and inspect public release artifacts
        run: |
          python -m build --sdist
          python -m pip wheel --no-deps --wheel-dir dist dist/*.tar.gz
          python -m twine check --strict dist/*
          python .github/scripts/smoke_wheel.py dist/*.whl
          python .github/scripts/check_release_artifacts.py dist
