name: Deploy CoupFE-EDA website

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "examples/**"
      - "eda_multiphysics/tsv_device.py"
      - "eda_multiphysics/tsv_stress.py"
      - "eda_multiphysics/workbench.py"
      - "tests/test_workbench.py"
      - "pyproject.toml"
      - "benchmarks/solver_scaling/**"
      - "benchmarks/tsv_release_scorecard.json"
      - "docs/VALIDATION_GUIDE.md"
      - "docs/validation_guide/figures/**"
      - "LICENSE"
      - "LICENSES/CC-BY-4.0.txt"
      - "NOTICE"
      - "THIRD_PARTY.md"
      - "docs/LICENSE.md"
      - ".github/workflows/coupfe-workbench-pages.yml"
  workflow_dispatch:

# Building dependencies does not need deployment authority. Only the second
# job receives the two write permissions required by GitHub Pages.
permissions:
  contents: read

concurrency:
  group: coupfe-workbench-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VITE_BASE_PATH: /CoupFE-EDA/
      VITE_COUPFE_BACKEND: mock
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the lightweight TSV execution path
        run: python -m pip install -e .. pytest

      - name: Reproduce the retained TSV browser artifacts
        run: python -m pytest -q ../tests/test_workbench.py

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Reject unreviewed prototype evidence
        run: |
          if grep -En \
            'coupfe-eda@8a3d91e|coupfe-core 0\.7\.0|thermal-validation-v2|mesh-study-04|interface-limit-v2|margin-validation-v1' \
            src/demo/snapshot.ts; then
            echo "The public snapshot still contains the unreviewed prototype evidence record." >&2
            exit 1
          fi

      - name: Type-check, test, and build the public frontend
        run: npm run check

      - name: Verify project and dependency notices in the site artifact
        run: |
          for notice in LICENSE CC-BY-4.0.txt NOTICE THIRD_PARTY.md LICENSE-SCOPE.md; do
            test -s "dist/legal/${notice}"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
