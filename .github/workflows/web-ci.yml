name: web-ci

on:
  push:
    paths:
      - "web/**"
      - "examples/**"
      - "benchmarks/solver_scaling/**"
      - "benchmarks/tsv_release_scorecard.json"
      - "docs/VALIDATION_GUIDE.md"
      - "docs/validation_guide/figures/**"
      - "eda_multiphysics/workbench.py"
      - "eda_multiphysics/workbench_api.py"
      - "eda_multiphysics/tsv_device.py"
      - "eda_multiphysics/tsv_stress.py"
      - "tests/test_workbench.py"
      - "tests/test_workbench_api.py"
      - "pyproject.toml"
      - "setup.sh"
      - "LICENSE"
      - "LICENSES/CC-BY-4.0.txt"
      - "NOTICE"
      - "THIRD_PARTY.md"
      - "docs/LICENSE.md"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "examples/**"
      - "benchmarks/solver_scaling/**"
      - "benchmarks/tsv_release_scorecard.json"
      - "docs/VALIDATION_GUIDE.md"
      - "docs/validation_guide/figures/**"
      - "eda_multiphysics/workbench.py"
      - "eda_multiphysics/workbench_api.py"
      - "eda_multiphysics/tsv_device.py"
      - "eda_multiphysics/tsv_stress.py"
      - "tests/test_workbench.py"
      - "tests/test_workbench_api.py"
      - "pyproject.toml"
      - "setup.sh"
      - "LICENSE"
      - "LICENSES/CC-BY-4.0.txt"
      - "NOTICE"
      - "THIRD_PARTY.md"
      - "docs/LICENSE.md"
      - ".github/workflows/web-ci.yml"
      - ".github/workflows/coupfe-workbench-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VITE_BASE_PATH: /CoupFE-EDA/
      VITE_COUPFE_BACKEND: mock
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Reject unreviewed prototype evidence
        run: |
          if grep -En \
            'coupfe-eda@8a3d91e|coupfe-core 0\.7\.0|thermal-validation-v2|mesh-study-04|interface-limit-v2|margin-validation-v1' \
            src/demo/snapshot.ts; then
            echo "The public snapshot still contains the unreviewed prototype evidence record." >&2
            exit 1
          fi

      - name: Type-check, test, and build the public frontend
        run: npm run check

  local-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the optional localhost API and its test client
        run: |
          python -m pip install -e ".[workbench]" "httpx>=0.27,<1"
          python -m pip check

      - name: Test the allowlisted executor and localhost API boundary
        run: python -m pytest -q tests/test_workbench.py tests/test_workbench_api.py
